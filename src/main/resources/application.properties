# ============================================
# BANCO DE DADOS - SQL Server
# Windows Authentication (sem senha!)
# ============================================

spring.datasource.url=jdbc:sqlserver://localhost;databaseName=controle_estoque;integratedSecurity=true;encrypt=true;trustServerCertificate=true

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ============================================
# JPA / HIBERNATE
# ============================================

# Cria e atualiza tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL no console (ótimo para aprender!)
spring.jpa.show-sql=true

# Deixa o SQL organizado e legível
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# ============================================
# SERVIDOR
# ============================================

server.port=8080
spring.application.name=controle-estoque